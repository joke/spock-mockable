name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0. Set only to re-publish a failed release.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: joke/workflows/.github/workflows/gradle-release.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
